[project]
name = "csd-viewer"
version = "1.3.0-beta.3"
description = ""
authors = [
    {name = "Jessica Rehak",email = "rehak@lbl.gov"}
]
# readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyqt6 (>=6.10.2,<7.0.0)",
    "tk (>=0.1.0,<0.2.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "numpy (>=2.4.1,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "appdirs (>=1.4.4,<2.0.0)",
    "ttkbootstrap (>=1.20.0,<2.0.0)",
    "ops-ecris-analysis @ git+https://github.com/lbnl-88ops/ecris.analysis.git@v1.4.1",
    "ops-ecris @ git+https://github.com/lbnl-88ops/ecris.git@v0.2.0",
    "requests (>=2.32.5,<3.0.0)",
    "pyside6 (>=6.11.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
csd_viewer = "app:csd_viewer"

[tool.poetry.group.windows-build]
optional = true

[tool.poetry.group.windows-build.dependencies]
pyinstaller = "^6.18.0"

